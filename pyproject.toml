[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "scancheck-cli"
version = "1.0.0"
description = "Offline document scanner and image quality analyzer"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6", "opencv-python-headless==4.12.0.88"]

[project.scripts]
scancheck = "scancheck.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
